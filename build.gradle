
plugins {
	id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// このmod は全体がクライアントonlyのため、src/client/java と src/client/resources を
// main ソースセットに統合する（NeoForgeはFabric Loomのような自動split環境をもたない）
sourceSets {
	main {
		java {
			srcDir 'src/client/java'
		}
		resources {
			srcDir 'src/client/resources'
		}
	}
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		chattranslator {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// Gson（設定ファイルのJSON読み書き用）
	implementation 'com.google.code.gson:gson:2.10.1'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
	manifest {
		attributes([
			'Specification-Title'   : project.mod_version,
			'Specification-Vendor'  : 'onemunanoyo',
			'Implementation-Title'  : project.archives_base_name,
			'Implementation-Version': project.mod_version,
		])
	}
}
